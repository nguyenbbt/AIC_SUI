services:
  # ===================== Infrastructure =====================

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: aic_nova_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    expose:
      - 2379
    volumes:
      - type: bind
        source: ${AIC_LOCAL_DATA_ROOT:-./data}/databases/etcd
        target: /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: aic_nova_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9001:9001"
    expose:
      - 9000
    volumes:
      - type: bind
        source: ${AIC_LOCAL_DATA_ROOT:-./data}/databases/minio
        target: /minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===================== Milvus 2.5.x =====================

  milvus-standalone:
    image: milvusdb/milvus:v2.5.0
    container_name: aic_nova_milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - type: bind
        source: ${AIC_LOCAL_DATA_ROOT:-./data}/databases/milvus
        target: /var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===================== Elasticsearch 8.x + ICU Plugin =====================

  elasticsearch:
    build:
      context: .
      dockerfile: indexing/elasticsearch.Dockerfile
    container_name: aic_nova_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - type: bind
        source: ${AIC_LOCAL_DATA_ROOT:-./data}/databases/elasticsearch
        target: /usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===================== Indexing Service =====================

  indexing:
    build:
      context: .
      dockerfile: indexing/Dockerfile
    container_name: aic_nova_indexing
    volumes:
      - type: bind
        source: ${AIC_LOCAL_DATA_ROOT:-./data}
        target: /workspace/data
    environment:
      DATA_DIR: /workspace/data/processed
      MILVUS_URI: http://milvus-standalone:19530
      ES_URI: http://elasticsearch:9200
      DB_URI: sqlite:////workspace/data/metadata.db
    depends_on:
      milvus-standalone:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command:
      - python
      - -m
      - src.indexing.cli
